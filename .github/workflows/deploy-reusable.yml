name: Deploy Reusable

on:
  workflow_call:
    inputs:
      deploy_files:
        description: "Files to deploy: all or html_ico"
        required: false
        default: all
        type: string
      environment:
        description: GitHub environment for this deployment
        required: true
        type: string
      project_environment:
        description: Project environment for this deployment
        required: true
        type: string
      public_base_url_kind:
        description: "Public base URL source: dev or releases"
        required: true
        type: string
      public_base_url_path:
        description: Public base URL path suffix
        required: false
        default: ""
        type: string
      server_dir:
        description: Server directory
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve public base URL
        id: public_base_url
        shell: bash
        env:
          DEV_PUBLIC_BASE_URL: ${{ vars.DEV_PUBLIC_BASE_URL }}
          PUBLIC_BASE_URL_KIND: ${{ inputs.public_base_url_kind }}
          PUBLIC_BASE_URL_PATH: ${{ inputs.public_base_url_path }}
          RELEASES_PUBLIC_BASE_URL: ${{ vars.RELEASES_PUBLIC_BASE_URL }}
        run: |
          case "$PUBLIC_BASE_URL_KIND" in
            dev)
              public_base_url="${DEV_PUBLIC_BASE_URL%/}${PUBLIC_BASE_URL_PATH}"
              ;;
            releases)
              public_base_url="${RELEASES_PUBLIC_BASE_URL%/}${PUBLIC_BASE_URL_PATH}"
              ;;
            *)
              echo "Expected public_base_url_kind to be dev or releases, got: $PUBLIC_BASE_URL_KIND" >&2
              exit 1
              ;;
          esac

          if [[ -z "$public_base_url" || "$public_base_url" == "$PUBLIC_BASE_URL_PATH" ]]; then
            echo "Public base URL resolved to an empty base for kind: $PUBLIC_BASE_URL_KIND" >&2
            exit 1
          fi

          echo "public_base_url=$public_base_url" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PROJECT_ENVIRONMENT: ${{ inputs.project_environment }}
          PUBLIC_BASE_URL: ${{ steps.public_base_url.outputs.public_base_url }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create server directory
        run: |
          ssh "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}" \
            "mkdir -p '${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}'"

      - name: Rsync all files
        if: inputs.deploy_files == 'all'
        run: |
          rsync -az --delete --progress \
            ./dist/public/ \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}"

      - name: Rsync HTML and favicon files
        if: inputs.deploy_files == 'html_ico'
        run: |
          rsync -az --delete --delete-excluded --prune-empty-dirs --progress \
            --include='*/' \
            --include='*.html' \
            --include='*.ico' \
            --exclude='*' \
            ./dist/public/ \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}"
