name: Deploy Reusable

on:
  workflow_call:
    inputs:
      deploy_files:
        description: "Files to deploy: all, html, or html_skill"
        required: false
        default: all
        type: string
      environment:
        description: GitHub environment for this deployment
        required: true
        type: string
      htaccess_mode:
        description: ".htaccess mode: no-cache or immutable"
        required: true
        type: string
      public_base_url_kind:
        description: "Public base URL source: dev, prod, or releases"
        required: true
        type: string
      public_base_url_path:
        description: Public base URL path suffix
        required: false
        default: ""
        type: string
      skill_public_base_url_kind:
        description: "Skill public base URL source: dev, prod, releases, or empty to use public_base_url_kind"
        required: false
        default: ""
        type: string
      skill_public_base_url_path:
        description: Skill public base URL path suffix
        required: false
        default: ""
        type: string
      server_dir:
        description: Server directory
        required: true
        type: string

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve public base URL
        id: public_base_url
        shell: bash
        env:
          DEV_PUBLIC_BASE_URL: ${{ vars.DEV_PUBLIC_BASE_URL }}
          PROD_PUBLIC_BASE_URL: ${{ vars.PROD_PUBLIC_BASE_URL }}
          PUBLIC_BASE_URL_KIND: ${{ inputs.public_base_url_kind }}
          PUBLIC_BASE_URL_PATH: ${{ inputs.public_base_url_path }}
          RELEASES_PUBLIC_BASE_URL: ${{ vars.RELEASES_PUBLIC_BASE_URL }}
          SKILL_PUBLIC_BASE_URL_KIND: ${{ inputs.skill_public_base_url_kind }}
          SKILL_PUBLIC_BASE_URL_PATH: ${{ inputs.skill_public_base_url_path }}
        run: |
          resolve_public_base_url() {
            local kind="$1"
            local path="$2"
            local input_name="$3"
            local public_base_url

            case "$kind" in
              dev)
                public_base_url="${DEV_PUBLIC_BASE_URL%/}${path}"
                ;;
              prod)
                public_base_url="${PROD_PUBLIC_BASE_URL%/}${path}"
                ;;
              releases)
                public_base_url="${RELEASES_PUBLIC_BASE_URL%/}${path}"
                ;;
              *)
                echo "Expected $input_name to be dev, prod, or releases, got: $kind" >&2
                exit 1
                ;;
            esac

            if [[ -z "$public_base_url" || "$public_base_url" == "$path" ]]; then
              echo "Public base URL resolved to an empty base for $input_name: $kind" >&2
              exit 1
            fi

            printf '%s\n' "$public_base_url"
          }

          public_base_url="$(resolve_public_base_url "$PUBLIC_BASE_URL_KIND" "$PUBLIC_BASE_URL_PATH" "public_base_url_kind")"

          if [[ -n "$SKILL_PUBLIC_BASE_URL_KIND" ]]; then
            skill_public_base_url="$(resolve_public_base_url "$SKILL_PUBLIC_BASE_URL_KIND" "$SKILL_PUBLIC_BASE_URL_PATH" "skill_public_base_url_kind")"
          else
            skill_public_base_url="$public_base_url"
          fi

          echo "public_base_url=$public_base_url" >> "$GITHUB_OUTPUT"
          echo "skill_public_base_url=$skill_public_base_url" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PUBLIC_BASE_URL: ${{ steps.public_base_url.outputs.public_base_url }}
          SKILL_PUBLIC_BASE_URL: ${{ steps.public_base_url.outputs.skill_public_base_url }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create server directory
        run: |
          ssh "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}" \
            "mkdir -p '${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}'"

      - name: Rsync all files
        if: inputs.deploy_files == 'all'
        run: |
          rsync -az --delete --progress \
            ./dist/public/ \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}"

      - name: Rsync HTML, favicon, and image files
        if: inputs.deploy_files == 'html'
        run: |
          rsync -az --delete --delete-excluded --prune-empty-dirs --progress \
            --include='*/' \
            --include='*.html' \
            --include='*.ico' \
            --include='img/***' \
            --exclude='*' \
            ./dist/public/ \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}"

      - name: Rsync HTML and skill files
        if: inputs.deploy_files == 'html_skill'
        run: |
          rsync -az --delete --delete-excluded --prune-empty-dirs --progress \
            --include='*/' \
            --include='*.html' \
            --include='*.ico' \
            --include='img/***' \
            --include='install-skill.sh' \
            --include='SKILL.zip' \
            --exclude='*' \
            ./dist/public/ \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}"

      - name: Deploy .htaccess
        shell: bash
        env:
          HTACCESS_MODE: ${{ inputs.htaccess_mode }}
        run: |
          case "$HTACCESS_MODE" in
            immutable|no-cache)
              htaccess_file="./htaccess/$HTACCESS_MODE/.htaccess"
              ;;
            *)
              echo "Expected htaccess_mode to be no-cache or immutable, got: $HTACCESS_MODE" >&2
              exit 1
              ;;
          esac

          if [[ ! -f "$htaccess_file" ]]; then
            echo "Missing .htaccess file: $htaccess_file" >&2
            exit 1
          fi

          rsync -az --progress \
            "$htaccess_file" \
            "${{ vars.SSH_LOGIN }}@${{ vars.SSH_HOST }}:${{ vars.SSH_ROOT_DIRECTORY }}${{ inputs.server_dir }}.htaccess"
