name: Deploy Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Server Directory
    runs-on: ubuntu-latest
    outputs:
      release_major: ${{ steps.resolve.outputs.release_major }}
      server_dir: ${{ steps.resolve.outputs.server_dir }}
    steps:
      - name: Resolve Server Directory
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected SemVer Tag in format vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          echo "release_major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "server_dir=releases/v${BASH_REMATCH[1]}/" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Deploy Prod
    needs:
      - prepare
      - deploy-release
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      deploy_files: html_ico
      environment: prod
      htaccess_mode: no-cache
      project_environment: prod
      public_base_url_kind: releases
      public_base_url_path: /v${{ needs.prepare.outputs.release_major }}
      server_dir: prod/
    secrets: inherit

  deploy-release:
    name: Deploy Release
    needs: prepare
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      deploy_files: all
      environment: prod
      htaccess_mode: immutable
      project_environment: prod
      public_base_url_kind: releases
      public_base_url_path: /v${{ needs.prepare.outputs.release_major }}
      server_dir: ${{ needs.prepare.outputs.server_dir }}
    secrets: inherit
