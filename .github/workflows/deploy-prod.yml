name: Deploy Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy Prod
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      project_environment: prod
      server_dir: prod/
    secrets: inherit

  prepare:
    name: Resolve Server Directory
    runs-on: ubuntu-latest
    outputs:
      server_dir: ${{ steps.resolve.outputs.server_dir }}
    steps:
      - name: Resolve Server Directory
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected SemVer Tag in format vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          echo "server_dir=releases/v${BASH_REMATCH[1]}/" >> "$GITHUB_OUTPUT"

  deploy-release:
    name: Deploy Release
    needs: prepare
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      project_environment: prod
      server_dir: ${{ needs.prepare.outputs.server_dir }}
    secrets: inherit
