name: Deploy Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Server Directory
    runs-on: ubuntu-latest
    outputs:
      server_dir: ${{ steps.resolve.outputs.server_dir }}
      public_base_url: ${{ steps.resolve.outputs.public_base_url }}
    steps:
      - name: Resolve Server Directory
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASES_PUBLIC_BASE_URL: ${{ vars.RELEASES_PUBLIC_BASE_URL }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected SemVer Tag in format vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          echo "server_dir=releases/v${BASH_REMATCH[1]}/" >> "$GITHUB_OUTPUT"
          echo "public_base_url=${RELEASES_PUBLIC_BASE_URL%/}/v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Deploy Prod
    needs:
      - prepare
      - deploy-release
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      deploy_files: html_ico
      environment: prod
      project_environment: prod
      public_base_url: ${{ needs.prepare.outputs.public_base_url }}
      server_dir: prod/
    secrets: inherit

  deploy-release:
    name: Deploy Release
    needs: prepare
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      deploy_files: all
      environment: prod
      project_environment: prod
      public_base_url: ${{ needs.prepare.outputs.public_base_url }}
      server_dir: ${{ needs.prepare.outputs.server_dir }}
    secrets: inherit
